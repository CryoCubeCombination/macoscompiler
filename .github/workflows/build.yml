name: Build Windows App with Nuitka

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11.9' 
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Compile with Nuitka
      uses: Nuitka/Nuitka-Action@main
      with:
        nuitka-version: main
        script-name: activator.py
        # CORRECCIÓN: Usamos 'onefile' directamente en el parámetro 'mode' que sí es válido
        mode: onefile
        windows-console-mode: disable
        include-data-files: |
          *.png=./

    # CORRECCIÓN: Usamos el comodín *.exe para que capture el archivo sin importar las mayúsculas
    - name: Upload Windows App
      uses: actions/upload-artifact@v4
      with:
        name: windows-app
        path: build/*.exe
