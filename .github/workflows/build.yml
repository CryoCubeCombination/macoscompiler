name: Build macOS App with Nuitka

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11.9' # Your exact Python version
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Compile with Nuitka
      uses: Nuitka/Nuitka-Action@main
      with:
        nuitka-version: main
        script-name: activator.py # Your exact script name
        mode: app
        disable-console: true
        include-data-files: |
          *.png=./

    - name: Zip App Bundle
      run: |
        zip -r main_macos.zip *.app

    - name: Upload macOS App
      uses: actions/upload-artifact@v4
      with:
        name: macos-app
        path: main_macos.zip
