name: Build macOS App with Nuitka

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11.9'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Compile with Nuitka
      uses: Nuitka/Nuitka-Action@main
      with:
        nuitka-version: main
        script-name: main.py
        onefile: true
        # Hides the terminal window on launch
        disable-console: true
        # Creates a standard macOS .app bundle instead of a command-line binary
        macos-create-app-bundle: true
        include-data-file: |
          *.png=.
          *.jpg=.
          *.jpeg=.

    # macOS .app structures are folders. We zip it so GitHub can upload it cleanly.
    - name: Zip App Bundle
      run: |
        cd build
        zip -r ../main_macos.zip main.app
