name: Build Windows App with Nuitka

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest # Switches the runner to a Windows server

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11.9' 
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Compile with Nuitka
      uses: Nuitka/Nuitka-Action@main
      with:
        nuitka-version: main
        script-name: activator.py
        mode: onefile # Bundles everything into an execution folder
        disable-console: true # Hides the black command prompt window on launch
        enable-plugins: |
          tk-inter
        include-data-files: |
          *.png=./

    # FIX: Uses Windows PowerShell to safely compress the build folder into a standard .zip file
    - name: Zip App Bundle (PowerShell)
      shell: powershell
      run: |
        Compress-Archive -Path "build/activator.dist/*" -DestinationPath "main_windows.zip" -Force

    - name: Upload Windows App
      uses: actions/upload-artifact@v4
      with:
        name: windows-app
        path: main_windows.zip
