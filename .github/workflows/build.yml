name: Build macOS App with Nuitka

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: windows-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11.9' # Your exact Python version
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Compile with Nuitka
      uses: Nuitka/Nuitka-Action@main
      with:
        nuitka-version: main
        script-name: activator.py # Your exact script name
        mode: exe
        windows-console-mode: |
          disable
        include-data-files: |
          *.png=./
        enable-plugins: |
          tk-inter
    
    - name: Zip App Bundle
      run: |
        cd build
        # This matches activator.app or Activator.app perfectly, ignoring the build cache folder
        zip -r ../main_windows.zip [aA]ctivator.exe

    - name: Upload macOS App
      uses: actions/upload-artifact@v4
      with:
        name: windows-activator
        path: main_windows.zip
